name: Aperture Worker Release Packet

on:
  workflow_dispatch:
    inputs:
      sourceTag:
        description: Signed Aperture worker source tag
        required: true
        default: aperture-worker-v0.1.1
      sourceCommit:
        description: Exact reviewed Aperture source commit
        required: true
        default: 00e150a6dd099607f328f276ef48c2e9938a4a29

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_SOURCE_TAG: aperture-worker-v0.1.1
      EXPECTED_SOURCE_COMMIT: 00e150a6dd099607f328f276ef48c2e9938a4a29
      SOURCE_TAG: ${{ inputs.sourceTag }}
      SOURCE_COMMIT: ${{ inputs.sourceCommit }}
      ARCHIVE_NAME: aperture-worker-v0.1.1.tar.gz
      RELEASE_URL: https://github.com/${{ github.repository }}/releases/download/aperture-worker-v0.1.1/aperture-worker-v0.1.1.tar.gz

    steps:
      - name: Checkout release-packet tooling
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize trusted packet paths
        run: |
          printf 'PAYLOAD_DIR=%s/aperture-worker\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'REPORT_DIR=%s/reports\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'PACKET_DIR=%s/release-packet\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Verify signed source tag contract
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$SOURCE_TAG" = "$EXPECTED_SOURCE_TAG"
          test "$SOURCE_COMMIT" = "$EXPECTED_SOURCE_COMMIT"
          tag_object=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$SOURCE_TAG" --jq '.object.sha')
          tag_type=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$SOURCE_TAG" --jq '.object.type')
          test "$tag_type" = "tag"
          tag_commit=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" --jq '.object.sha')
          tag_verified=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" --jq '.verification.verified')
          test "$tag_commit" = "$SOURCE_COMMIT"
          test "$tag_verified" = "true"

      - name: Checkout exact signed source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sourceTag }}
          fetch-depth: 0
          path: source

      - name: Confirm exact clean source checkout
        run: |
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git -C source status --porcelain)"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.1

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Install release tooling and exact source dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir source install --frozen-lockfile

      - name: Build exact trusted worker and OMP payload
        env:
          CI: "true"
          APERTURE_TRUSTED_CI: "1"
          APERTURE_SOURCE_TAG: ${{ inputs.sourceTag }}
          APERTURE_SOURCE_COMMIT: ${{ inputs.sourceCommit }}
        run: >-
          pnpm --dir source/packages/aperture build:attention-worker --
          --output-dir "$PAYLOAD_DIR"

      - name: Run worker and OMP source contract tests
        run: |
          pnpm --dir source exec tsx --test packages/aperture/test/notification-worker.test.ts
          pnpm --dir source/packages/omp test

      - name: Validate exact payload on Node 22
        run: >-
          pnpm --dir source/packages/aperture smoke:attention-worker --
          --worker "$PAYLOAD_DIR/lib/aperture-attention-engine.cjs"
          --report "$REPORT_DIR/node-22.23.2.json"

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm

      - name: Validate exact payload on Node 24
        run: >-
          pnpm --dir source exec tsx
          packages/aperture/scripts/smoke-attention-worker.ts
          --worker "$PAYLOAD_DIR/lib/aperture-attention-engine.cjs"
          --report "$REPORT_DIR/node-24.13.0.json"

      - name: Setup current Omarchy Node
        uses: actions/setup-node@v4
        with:
          node-version: 26.4.0
          cache: pnpm

      - name: Validate exact payload on current Node
        run: >-
          pnpm --dir source exec tsx
          packages/aperture/scripts/smoke-attention-worker.ts
          --worker "$PAYLOAD_DIR/lib/aperture-attention-engine.cjs"
          --report "$REPORT_DIR/node-26.4.0.json"

      - name: Validate exact OMP extension artifact
        run: >-
          pnpm --dir source/packages/aperture smoke:omp-extension --
          --extension "$PAYLOAD_DIR/integrations/omp/aperture-omp-extension.mjs"
          --manifest "$PAYLOAD_DIR/integrations/omp/package.json"
          --report "$REPORT_DIR/omp-adapter.json"

      - name: Setup Bun for actual OMP host compatibility
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Exercise exact extension through OMP 18 loader
        env:
          OPENAI_API_KEY: compatibility-probe-not-used
          OMP_COMPAT_MARKER: ${{ runner.temp }}/omp-18-loaded
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/omp-agent
        run: |
          bunx @oh-my-pi/pi-coding-agent@18.0.11 --version > "$RUNNER_TEMP/omp-18-version.txt" 2>&1
          grep -q '^omp v18\.0\.11$' "$RUNNER_TEMP/omp-18-version.txt"
          omp_version=18.0.11
          extension_url="file://$PAYLOAD_DIR/integrations/omp/aperture-omp-extension.mjs"
          cat > "$RUNNER_TEMP/omp-18-wrapper.mjs" <<EOF
          import { writeFileSync } from "node:fs";
          import extension from "$extension_url";
          export default async function compatibilityProbe(pi) {
            await extension(pi);
            writeFileSync(process.env.OMP_COMPAT_MARKER, "loaded\\n", "utf8");
          }
          EOF
          bunx @oh-my-pi/pi-coding-agent@18.0.11 \
            --no-extensions \
            --extension "$RUNNER_TEMP/omp-18-wrapper.mjs" \
            --mode rpc \
            --no-session \
            --model openai/gpt-4o \
            > "$RUNNER_TEMP/omp-18-rpc.jsonl"
          test "$(cat "$OMP_COMPAT_MARKER")" = "loaded"
          grep -q '"type":"ready"' "$RUNNER_TEMP/omp-18-rpc.jsonl"
          extension_bytes=$(stat -c '%s' "$PAYLOAD_DIR/integrations/omp/aperture-omp-extension.mjs")
          extension_sha=$(sha256sum "$PAYLOAD_DIR/integrations/omp/aperture-omp-extension.mjs" | cut -d' ' -f1)
          jq -n \
            --arg ompVersion "$omp_version" \
            --arg extensionSha256 "$extension_sha" \
            --argjson extensionBytes "$extension_bytes" \
            '{
              schemaVersion: 1,
              status: "passed",
              ompVersion: $ompVersion,
              package: "@oh-my-pi/pi-coding-agent@18.0.11",
              hostRuntime: "bun-1.3.14",
              actualExtensionLoader: true,
              rpcReady: true,
              modelRequestSent: false,
              extensionSha256: $extensionSha256,
              extensionBytes: $extensionBytes
            }' > "$PAYLOAD_DIR/evidence/omp-18.0.11.json"
          chmod 0644 "$PAYLOAD_DIR/evidence/omp-18.0.11.json"

      - name: Finalize source validation evidence
        run: >-
          pnpm --dir source/packages/aperture finalize:attention-worker --
          --artifact-dir "$PAYLOAD_DIR"
          --node-report "$REPORT_DIR/node-22.23.2.json"
          --node-report "$REPORT_DIR/node-24.13.0.json"
          --node-report "$REPORT_DIR/node-26.4.0.json"
          --omp-report "$REPORT_DIR/omp-adapter.json"
          --attestation-reference "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Stage and validate complete combined payload
        run: >-
          pnpm exec tsx packages/aperture/scripts/finalize-combined-release-packet.ts --
          --artifact-dir "$PAYLOAD_DIR"
          --source-commit "$SOURCE_COMMIT"
          --source-tag "$SOURCE_TAG"
          --attestation-reference "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Attest every declared payload file
        id: payload-provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            ${{ runner.temp }}/aperture-worker/config/*.json
            ${{ runner.temp }}/aperture-worker/evidence/*.json
            ${{ runner.temp }}/aperture-worker/integrations/omp/*
            ${{ runner.temp }}/aperture-worker/lib/*
            ${{ runner.temp }}/aperture-worker/schemas/*.json

      - name: Record payload provenance and verify final manifest
        run: |
          pnpm exec tsx packages/aperture/scripts/finalize-combined-release-packet.ts -- \
            --artifact-dir "$PAYLOAD_DIR" \
            --source-commit "$SOURCE_COMMIT" \
            --source-tag "$SOURCE_TAG" \
            --attestation-reference "${{ steps.payload-provenance.outputs.attestation-url }}"
          pnpm exec tsx packages/aperture/scripts/finalize-combined-release-packet.ts -- \
            --artifact-dir "$PAYLOAD_DIR" \
            --source-commit "$SOURCE_COMMIT" \
            --source-tag "$SOURCE_TAG" \
            --verify-only

      - name: Create deterministic complete archive and checksums
        run: |
          mkdir -p "$PACKET_DIR"
          source_epoch=$(git -C source show -s --format=%ct "$SOURCE_COMMIT")
          tar \
            --sort=name \
            --mtime="@$source_epoch" \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -cf "$PACKET_DIR/aperture-worker-v0.1.1.tar" \
            -C "$PAYLOAD_DIR" \
            BUILDINFO.json config evidence integrations lib schemas
          gzip -n "$PACKET_DIR/aperture-worker-v0.1.1.tar"
          test -f "$PACKET_DIR/$ARCHIVE_NAME"
          (cd "$PACKET_DIR" && sha256sum "$ARCHIVE_NAME" > "$ARCHIVE_NAME.sha256")
          buildinfo_sha=$(sha256sum "$PAYLOAD_DIR/BUILDINFO.json" | cut -d' ' -f1)
          printf '%s  BUILDINFO.json\n' "$buildinfo_sha" > "$PACKET_DIR/BUILDINFO.sha256"

      - name: Attest complete release archive
        id: archive-provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ runner.temp }}/release-packet/aperture-worker-v0.1.1.tar.gz

      - name: Write trusted release verification report
        run: >-
          pnpm exec tsx packages/aperture/scripts/write-combined-release-report.ts --
          --artifact-dir "$PAYLOAD_DIR"
          --archive "$PACKET_DIR/$ARCHIVE_NAME"
          --archive-attestation-reference "${{ steps.archive-provenance.outputs.attestation-url }}"
          --artifact-url "$RELEASE_URL"
          --output "$PACKET_DIR/release-report.json"

      - name: Upload trusted release packet evidence
        uses: actions/upload-artifact@v4
        with:
          name: aperture-worker-v0.1.1-release-packet
          path: ${{ runner.temp }}/release-packet
          if-no-files-found: error
          compression-level: 0

      - name: Publish immutable GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Trusted combined Aperture worker and OMP release packet.

          Source tag: $SOURCE_TAG
          Source commit: $SOURCE_COMMIT
          Workflow run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          Payload attestation: ${{ steps.payload-provenance.outputs.attestation-url }}
          Archive attestation: ${{ steps.archive-provenance.outputs.attestation-url }}
          EOF
          gh release create "$SOURCE_TAG" \
            "$PACKET_DIR/$ARCHIVE_NAME" \
            "$PACKET_DIR/$ARCHIVE_NAME.sha256" \
            "$PACKET_DIR/BUILDINFO.sha256" \
            "$PACKET_DIR/release-report.json" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Aperture Worker v0.1.1" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
