name: Aperture Worker Direct Release

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Successful signed-tag Worker Artifact run
        required: true
        type: string

concurrency:
  group: aperture-worker-direct-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: startsWith(github.ref, 'refs/tags/aperture-worker-v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    env:
      SOURCE_TAG: ${{ github.ref_name }}
      SOURCE_COMMIT: ${{ github.sha }}
      ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}

    steps:
      - name: Checkout exact artifact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize release paths
        run: |
          test -n "$SOURCE_TAG"
          test -n "$SOURCE_COMMIT"
          [[ "$SOURCE_TAG" =~ ^aperture-worker-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$GITHUB_REF" = "refs/tags/$SOURCE_TAG"
          printf 'PAYLOAD_DIR=%s/aperture-worker\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'REPORT_DIR=%s/reports\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'PACKET_DIR=%s/release-packet\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'ARCHIVE_NAME=%s.tar.gz\n' "$SOURCE_TAG" >> "$GITHUB_ENV"

      - name: Verify authorized signed tag and canonical workflow chain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git status --porcelain)"
          tag_object=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$SOURCE_TAG" --jq '.object.sha')
          tag_type=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$SOURCE_TAG" --jq '.object.type')
          test "$tag_type" = "tag"
          verification_ref="refs/tags/release-verification/$SOURCE_TAG"
          git fetch --no-tags --force origin \
            "refs/tags/$SOURCE_TAG:$verification_ref"
          test "$(git rev-parse "$verification_ref")" = "$tag_object"
          test "$(git cat-file -t "$verification_ref")" = "tag"
          test "$(git rev-parse "$verification_ref^{}")" = "$SOURCE_COMMIT"
          git -c gpg.format=ssh \
            -c gpg.ssh.allowedSignersFile="$GITHUB_WORKSPACE/.github/release-signers" \
            verify-tag "$verification_ref"
          tag_commit=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" --jq '.object.sha')
          tag_verified=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" --jq '.verification.verified')
          test "$tag_commit" = "$SOURCE_COMMIT"
          test "$tag_verified" = "true"
          artifact_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN_ID")
          test "$(jq -r '.name' <<<"$artifact_run")" = "Aperture Worker Artifact"
          test "$(jq -r '.path' <<<"$artifact_run")" = ".github/workflows/aperture-worker-artifact.yml"
          test "$(jq -r '.event' <<<"$artifact_run")" = "push"
          test "$(jq -r '.conclusion' <<<"$artifact_run")" = "success"
          test "$(jq -r '.head_branch' <<<"$artifact_run")" = "$SOURCE_TAG"
          test "$(jq -r '.head_sha' <<<"$artifact_run")" = "$SOURCE_COMMIT"
          release_check_run=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/release-check.yml/runs?head_sha=$SOURCE_COMMIT&status=success&per_page=20" \
            --jq '.workflow_runs | map(select(.conclusion == "success" and .event == "push" and .head_branch == "main")) | first | .id')
          test -n "$release_check_run"
          printf 'RELEASE_CHECK_RUN_ID=%s\n' "$release_check_run" >> "$GITHUB_ENV"
          release_check=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$release_check_run")
          test "$(jq -r '.name' <<<"$release_check")" = "Release Check"
          test "$(jq -r '.event' <<<"$release_check")" = "push"
          test "$(jq -r '.conclusion' <<<"$release_check")" = "success"
          test "$(jq -r '.head_branch' <<<"$release_check")" = "main"
          test "$(jq -r '.head_sha' <<<"$release_check")" = "$SOURCE_COMMIT"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.29.1

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Install exact source dependencies
        run: pnpm install --frozen-lockfile

      - name: Run canonical focus release gate
        run: pnpm release:focus-check

      - name: Download exact successful Worker Artifact payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$PAYLOAD_DIR" "$REPORT_DIR" "$PACKET_DIR"
          gh run download "$ARTIFACT_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$SOURCE_TAG" \
            --dir "$PAYLOAD_DIR"

      - name: Verify downloaded payload identity and provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -e --arg commit "$SOURCE_COMMIT" --arg tag "$SOURCE_TAG" '
            .artifactType == "node-commonjs-bundle" and
            .apertureCommit == $commit and
            .apertureSourceTag == $tag and
            .trustedCi == true and
            .sourceDirty == false and
            .aperturePackageVersion == "0.10.0" and
            .apertureCoreVersion == "0.9.0" and
            .ompPackageVersion == "0.1.0" and
            .artifactLimits.maximumTextArtifactBytes == 524288 and
            .integrations.omp.packageVersion == "0.1.0" and
            .workerBundle.bytes <= 524288 and
            .integrations.omp.bytes <= 524288 and
            .workerContract.notificationOutputSchemaVersion == 4 and
            .workerContract.surfaceProtocolVersion == 4 and
            .workerContract.workerDirectProtocolVersion == 4 and
            .schemas.workerDirectMessage.version == 4 and
            .schemas.output.version == 4 and
            .schemas.surface.version == 4 and
            .validation.navigationProofId == "aperture-opaque-focus-navigation-v4" and
            .validation.focusBackendReport == "evidence/focus-backends.json" and
            .validation.status == "passed"
          ' "$PAYLOAD_DIR/BUILDINFO.json"
          gh attestation verify "$PAYLOAD_DIR/lib/aperture-attention-engine.cjs" \
            --repo "$GITHUB_REPOSITORY" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$SOURCE_COMMIT" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/aperture-worker-artifact.yml"
          gh attestation verify "$PAYLOAD_DIR/integrations/omp/aperture-omp-extension.mjs" \
            --repo "$GITHUB_REPOSITORY" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$SOURCE_COMMIT" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/aperture-worker-artifact.yml"
          pnpm exec tsx packages/aperture/scripts/finalize-direct-release-packet.ts -- \
            --artifact-dir "$PAYLOAD_DIR" \
            --source-commit "$SOURCE_COMMIT" \
            --source-tag "$SOURCE_TAG" \
            --verify-only

      - name: Validate exact payload on Node 22
        run: |
          pnpm --dir packages/aperture smoke:attention-worker -- \
            --worker "$PAYLOAD_DIR/lib/aperture-attention-engine.cjs" \
            --report "$REPORT_DIR/node-22.json"
          pnpm --dir packages/aperture smoke:omp-direct-worker -- \
            --worker "$PAYLOAD_DIR/lib/aperture-attention-engine.cjs" \
            --report "$REPORT_DIR/direct-node-22.json"

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.13.0
          cache: pnpm

      - name: Validate exact payload on Node 24
        run: |
          pnpm --dir packages/aperture smoke:attention-worker -- \
            --worker "$PAYLOAD_DIR/lib/aperture-attention-engine.cjs" \
            --report "$REPORT_DIR/node-24.json"
          pnpm --dir packages/aperture smoke:omp-direct-worker -- \
            --worker "$PAYLOAD_DIR/lib/aperture-attention-engine.cjs" \
            --report "$REPORT_DIR/direct-node-24.json"

      - name: Setup current Omarchy Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.4.0
          cache: pnpm

      - name: Validate exact payload on current Node
        run: |
          pnpm --dir packages/aperture smoke:attention-worker -- \
            --worker "$PAYLOAD_DIR/lib/aperture-attention-engine.cjs" \
            --report "$REPORT_DIR/node-current.json"
          pnpm --dir packages/aperture smoke:omp-direct-worker -- \
            --worker "$PAYLOAD_DIR/lib/aperture-attention-engine.cjs" \
            --report "$REPORT_DIR/direct-node-current.json"
          pnpm --dir packages/aperture smoke:omp-extension -- \
            --extension "$PAYLOAD_DIR/integrations/omp/aperture-omp-extension.mjs" \
            --manifest "$PAYLOAD_DIR/integrations/omp/package.json" \
            --report "$REPORT_DIR/omp-adapter.json"

      - name: Setup Bun for actual OMP matrix
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Validate actual OMP 18 and current hosts
        run: >-
          pnpm --dir packages/aperture smoke:omp-host-direct --
          --worker "$PAYLOAD_DIR/lib/aperture-attention-engine.cjs"
          --extension "$PAYLOAD_DIR/integrations/omp/aperture-omp-extension.mjs"
          --omp-version 18.0.11
          --omp-version 18.1.2
          --report "$REPORT_DIR/omp-host-matrix.json"

      - name: Attest every declared payload file
        id: payload-provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            ${{ runner.temp }}/aperture-worker/config/*.json
            ${{ runner.temp }}/aperture-worker/evidence/*.json
            ${{ runner.temp }}/aperture-worker/fixtures/omp-direct/*.json
            ${{ runner.temp }}/aperture-worker/integrations/omp/*
            ${{ runner.temp }}/aperture-worker/lib/*
            ${{ runner.temp }}/aperture-worker/schemas/*.json

      - name: Record payload provenance and verify exact manifest
        run: |
          pnpm exec tsx packages/aperture/scripts/finalize-direct-release-packet.ts -- \
            --artifact-dir "$PAYLOAD_DIR" \
            --source-commit "$SOURCE_COMMIT" \
            --source-tag "$SOURCE_TAG" \
            --attestation-reference "${{ steps.payload-provenance.outputs.attestation-url }}"
          pnpm exec tsx packages/aperture/scripts/finalize-direct-release-packet.ts -- \
            --artifact-dir "$PAYLOAD_DIR" \
            --source-commit "$SOURCE_COMMIT" \
            --source-tag "$SOURCE_TAG" \
            --verify-only

      - name: Verify every payload attestation is tag-bound
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while IFS= read -r relative; do
            gh attestation verify "$PAYLOAD_DIR/$relative" \
              --repo "$GITHUB_REPOSITORY" \
              --source-ref "$GITHUB_REF" \
              --source-digest "$SOURCE_COMMIT" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/aperture-worker-direct-release.yml"
          done < <(jq -r '.files[].path' "$PAYLOAD_DIR/BUILDINFO.json")

      - name: Attest finalized BUILDINFO
        id: buildinfo-provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: ${{ runner.temp }}/aperture-worker/BUILDINFO.json

      - name: Verify finalized BUILDINFO attestation is tag-bound
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh attestation verify "$PAYLOAD_DIR/BUILDINFO.json"
          --repo "$GITHUB_REPOSITORY"
          --source-ref "$GITHUB_REF"
          --source-digest "$SOURCE_COMMIT"
          --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/aperture-worker-direct-release.yml"

      - name: Create deterministic complete archive and checksums
        run: |
          source_epoch=$(git show -s --format=%ct "$SOURCE_COMMIT")
          tar \
            --sort=name \
            --mtime="@$source_epoch" \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -cf "$PACKET_DIR/$SOURCE_TAG.tar" \
            -C "$PAYLOAD_DIR" \
            BUILDINFO.json config evidence fixtures integrations lib schemas
          gzip -n "$PACKET_DIR/$SOURCE_TAG.tar"
          test -f "$PACKET_DIR/$ARCHIVE_NAME"
          (cd "$PACKET_DIR" && sha256sum "$ARCHIVE_NAME" > "$ARCHIVE_NAME.sha256")
          buildinfo_sha=$(sha256sum "$PAYLOAD_DIR/BUILDINFO.json" | cut -d' ' -f1)
          printf '%s  BUILDINFO.json\n' "$buildinfo_sha" > "$PACKET_DIR/BUILDINFO.sha256"

      - name: Attest complete release archive
        id: archive-provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: ${{ runner.temp }}/release-packet/*.tar.gz

      - name: Verify archive attestation is tag-bound
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh attestation verify "$PACKET_DIR/$ARCHIVE_NAME"
          --repo "$GITHUB_REPOSITORY"
          --source-ref "$GITHUB_REF"
          --source-digest "$SOURCE_COMMIT"
          --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/aperture-worker-direct-release.yml"

      - name: Record completed packet inputs
        run: |
          archive_sha=$(sha256sum "$PACKET_DIR/$ARCHIVE_NAME" | cut -d' ' -f1)
          archive_bytes=$(wc -c < "$PACKET_DIR/$ARCHIVE_NAME" | tr -d '[:space:]')
          buildinfo_sha=$(sha256sum "$PAYLOAD_DIR/BUILDINFO.json" | cut -d' ' -f1)
          buildinfo_bytes=$(wc -c < "$PAYLOAD_DIR/BUILDINFO.json" | tr -d '[:space:]')
          jq -n \
            --arg sourceTag "$SOURCE_TAG" \
            --arg sourceCommit "$SOURCE_COMMIT" \
            --arg releaseCheckRunId "$RELEASE_CHECK_RUN_ID" \
            --arg workerArtifactRunId "$ARTIFACT_RUN_ID" \
            --arg directReleaseRunId "$GITHUB_RUN_ID" \
            --arg archiveName "$ARCHIVE_NAME" \
            --arg archiveSha256 "$archive_sha" \
            --arg archiveAttestationReference "${{ steps.archive-provenance.outputs.attestation-url }}" \
            --arg buildInfoSha256 "$buildinfo_sha" \
            --arg buildInfoAttestationReference "${{ steps.buildinfo-provenance.outputs.attestation-url }}" \
            --arg payloadAttestationReference "${{ steps.payload-provenance.outputs.attestation-url }}" \
            --argjson archiveBytes "$archive_bytes" \
            --argjson buildInfoBytes "$buildinfo_bytes" \
            '{
              schemaVersion: 1,
              sourceTag: $sourceTag,
              sourceCommit: $sourceCommit,
              releaseCheckRunId: $releaseCheckRunId,
              workerArtifactRunId: $workerArtifactRunId,
              directReleaseRunId: $directReleaseRunId,
              archive: { name: $archiveName, bytes: $archiveBytes, sha256: $archiveSha256 },
              buildInfo: { bytes: $buildInfoBytes, sha256: $buildInfoSha256 },
              attestations: {
                payload: $payloadAttestationReference,
                buildInfo: $buildInfoAttestationReference,
                archive: $archiveAttestationReference
              }
            }' > "$PACKET_DIR/direct-release-metadata.json"

      - name: Upload completed direct release packet
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.SOURCE_TAG }}-direct-release-packet
          path: ${{ runner.temp }}/release-packet
          if-no-files-found: error
          compression-level: 0
