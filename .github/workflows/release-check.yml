name: Release Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.29.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release checks
        run: pnpm release:check

  kernel-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.29.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run kernel gates
        run: pnpm kernel:conformance && pnpm kernel:corpus

  attention-worker-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node-version: [22, 24, 26]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.29.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build attention worker bundle
        run: pnpm --dir packages/aperture build

      - name: Run canonical focus release gate
        run: pnpm release:focus-check

      - name: Smoke clean-room attention worker
        run: pnpm --dir packages/aperture smoke:attention-worker
      - name: Smoke bundled OMP extension
        run: pnpm --dir packages/aperture smoke:omp-extension
      - name: Smoke direct OMP worker transport
        run: pnpm --dir packages/aperture smoke:omp-direct-worker

      - name: Stage unsigned artifact contract
        if: matrix.node-version == 22
        run: >-
          pnpm --dir packages/aperture build:attention-worker --
          --output-dir "$RUNNER_TEMP/aperture-attention-worker"
          --allow-unsigned-local

      - name: Validate staged candidate on Node 22
        if: matrix.node-version == 22
        run: >-
          pnpm --dir packages/aperture smoke:attention-worker --
          --worker "$RUNNER_TEMP/aperture-attention-worker/lib/aperture-attention-engine.cjs"
          --report "$RUNNER_TEMP/reports/node-22.json"

      - name: Validate direct transport on Node 22
        if: matrix.node-version == 22
        run: >-
          pnpm --dir packages/aperture smoke:omp-direct-worker --
          --worker "$RUNNER_TEMP/aperture-attention-worker/lib/aperture-attention-engine.cjs"
          --report "$RUNNER_TEMP/reports/direct-node-22.json"

      - name: Validate staged candidate on Node 24
        if: matrix.node-version == 22
        run: >-
          pnpm dlx node@24.13.0
          packages/aperture/node_modules/tsx/dist/cli.mjs
          packages/aperture/scripts/smoke-attention-worker.ts
          --worker "$RUNNER_TEMP/aperture-attention-worker/lib/aperture-attention-engine.cjs"
          --report "$RUNNER_TEMP/reports/node-24.json"

      - name: Validate direct transport on Node 24
        if: matrix.node-version == 22
        run: >-
          pnpm dlx node@24.13.0
          packages/aperture/node_modules/tsx/dist/cli.mjs
          packages/aperture/scripts/smoke-omp-direct-worker.ts
          --worker "$RUNNER_TEMP/aperture-attention-worker/lib/aperture-attention-engine.cjs"
          --report "$RUNNER_TEMP/reports/direct-node-24.json"

      - name: Validate staged candidate on current Node
        if: matrix.node-version == 22
        run: >-
          pnpm dlx node@26.4.0
          packages/aperture/node_modules/tsx/dist/cli.mjs
          packages/aperture/scripts/smoke-attention-worker.ts
          --worker "$RUNNER_TEMP/aperture-attention-worker/lib/aperture-attention-engine.cjs"
          --report "$RUNNER_TEMP/reports/node-current.json"

      - name: Validate direct transport on current Node
        if: matrix.node-version == 22
        run: >-
          pnpm dlx node@26.4.0
          packages/aperture/node_modules/tsx/dist/cli.mjs
          packages/aperture/scripts/smoke-omp-direct-worker.ts
          --worker "$RUNNER_TEMP/aperture-attention-worker/lib/aperture-attention-engine.cjs"
          --report "$RUNNER_TEMP/reports/direct-node-current.json"

      - name: Validate staged OMP extension
        if: matrix.node-version == 22
        run: >-
          pnpm --dir packages/aperture smoke:omp-extension --
          --extension "$RUNNER_TEMP/aperture-attention-worker/integrations/omp/aperture-omp-extension.mjs"
          --manifest "$RUNNER_TEMP/aperture-attention-worker/integrations/omp/package.json"
          --report "$RUNNER_TEMP/reports/omp-adapter.json"
      - name: Record positive three-backend focus smoke
        if: matrix.node-version == 22
        run: >-
          pnpm --dir packages/aperture smoke:focus-backends --
          --report "$RUNNER_TEMP/reports/focus-backends.json"

      - name: Setup Bun for OMP host matrix
        if: matrix.node-version == 22
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Validate actual OMP host matrix
        if: matrix.node-version == 22
        run: >-
          pnpm --dir packages/aperture smoke:omp-host-direct --
          --worker "$RUNNER_TEMP/aperture-attention-worker/lib/aperture-attention-engine.cjs"
          --extension "$RUNNER_TEMP/aperture-attention-worker/integrations/omp/aperture-omp-extension.mjs"
          --omp-version 18.0.11
          --omp-version 18.1.2
          --report "$RUNNER_TEMP/reports/omp-host-matrix.json"

      - name: Finalize unsigned candidate evidence
        if: matrix.node-version == 22
        run: >-
          pnpm --dir packages/aperture finalize:attention-worker --
          --artifact-dir "$RUNNER_TEMP/aperture-attention-worker"
          --node-report "$RUNNER_TEMP/reports/node-22.json"
          --node-report "$RUNNER_TEMP/reports/node-24.json"
          --node-report "$RUNNER_TEMP/reports/node-current.json"
          --direct-report "$RUNNER_TEMP/reports/direct-node-22.json"
          --omp-host-report "$RUNNER_TEMP/reports/omp-host-matrix.json"
          --direct-report "$RUNNER_TEMP/reports/direct-node-24.json"
          --direct-report "$RUNNER_TEMP/reports/direct-node-current.json"
          --omp-report "$RUNNER_TEMP/reports/omp-adapter.json"
          --focus-report "$RUNNER_TEMP/reports/focus-backends.json"

      - name: Verify staged artifact metadata
        if: matrix.node-version == 22
        run: |
          jq -e '
            .artifactType == "node-commonjs-bundle" and
            .artifactMode == "omp-only" and
            .minimumNodeMajor == 22 and
            .trustedCi == false and
            .aperturePackageVersion == "0.10.0" and
            .apertureCoreVersion == "0.9.0" and
            .runtimeDependencies.status == "passed" and
            .validation.status == "passed" and
            (.validation.nodeCompatibility | length) == 3 and
            (.validation.directNodeCompatibility | length) == 3 and
            .validation.conformanceProofId == "aperture-omp-only-worker-conformance-v1" and
            .validation.ompOnlyReport == "evidence/omp-only-worker.json" and
            .validation.ompHostProofId == "aperture-omp-host-direct-compatibility-v1" and
            .integrations.omp.hostCompatibility.status == "passed" and
            .validation.directTransportProofId == "aperture-omp-direct-transport-conformance-v1" and
            .validation.navigationProofId == "aperture-opaque-focus-navigation-v4" and
            .validation.focusBackendReport == "evidence/focus-backends.json" and
            .ompPackageVersion == "0.1.0" and
            .artifactLimits.maximumTextArtifactBytes == 524288 and
            .integrations.omp.packageVersion == "0.1.0" and
            .workerContract.notificationInput == false and
            .workerContract.ompWorkerOutputSchemaVersion == 4 and
            .workerContract.surfaceProtocolVersion == 4 and
            .workerContract.ompAttentionEventSchemaVersion == 4 and
            .workerContract.workerDirectProtocolVersion == 4 and
            .schemas.workerDirectMessage.version == 4 and
            .schemas.ompAttentionEvent.version == 4 and
            .schemas.output.version == 4 and
            .schemas.surface.version == 4 and
            (.files | length) == 36 and
            any(.files[]; .path == "evidence/omp-only-worker.json") and
            ([.files[].path] | index("evidence/ambient-ceiling.json")) == null and
            ([.files[].path] | index("fixtures/omp-direct/notification-fallback-ambient.json")) == null and
            [.files[].path] == ([.files[].path] | sort) and
            .integrations.omp.validation.status == "passed" and
            .integrations.omp.bytes <= 524288 and
            .workerBundle.bytes <= 524288
          ' "$RUNNER_TEMP/aperture-attention-worker/BUILDINFO.json"
