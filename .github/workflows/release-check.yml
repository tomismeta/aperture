name: Release Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.29.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release checks
        run: pnpm release:check

  kernel-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.29.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run kernel gates
        run: pnpm kernel:conformance && pnpm kernel:corpus

  attention-worker-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node-version: [22, 24, 26]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.29.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build attention worker bundle
        run: pnpm --dir packages/aperture build

      - name: Run canonical focus release gate
        run: pnpm release:focus-check

      - name: Smoke clean-room attention worker
        run: pnpm --dir packages/aperture smoke:attention-worker
      - name: Smoke bundled OMP extension
        run: pnpm --dir packages/aperture smoke:omp-extension
      - name: Smoke direct OMP worker transport
        run: pnpm --dir packages/aperture smoke:omp-direct-worker

      - name: Stage unsigned artifact contract
        if: matrix.node-version == 22
        run: >-
          pnpm --dir packages/aperture build:attention-worker --
          --output-dir "$RUNNER_TEMP/aperture-attention-worker"
          --allow-unsigned-local

      - name: Validate staged candidate on Node 22
        if: matrix.node-version == 22
        run: >-
          pnpm --dir packages/aperture smoke:attention-worker --
          --worker "$RUNNER_TEMP/aperture-attention-worker/lib/aperture-attention-engine.cjs"
          --report "$RUNNER_TEMP/reports/node-22.json"

      - name: Validate direct transport on Node 22
        if: matrix.node-version == 22
        run: >-
          pnpm --dir packages/aperture smoke:omp-direct-worker --
          --worker "$RUNNER_TEMP/aperture-attention-worker/lib/aperture-attention-engine.cjs"
          --report "$RUNNER_TEMP/reports/direct-node-22.json"

      - name: Validate staged candidate on Node 24
        if: matrix.node-version == 22
        run: >-
          pnpm dlx node@24.13.0
          packages/aperture/node_modules/tsx/dist/cli.mjs
          packages/aperture/scripts/smoke-attention-worker.ts
          --worker "$RUNNER_TEMP/aperture-attention-worker/lib/aperture-attention-engine.cjs"
          --report "$RUNNER_TEMP/reports/node-24.json"

      - name: Validate direct transport on Node 24
        if: matrix.node-version == 22
        run: >-
          pnpm dlx node@24.13.0
          packages/aperture/node_modules/tsx/dist/cli.mjs
          packages/aperture/scripts/smoke-omp-direct-worker.ts
          --worker "$RUNNER_TEMP/aperture-attention-worker/lib/aperture-attention-engine.cjs"
          --report "$RUNNER_TEMP/reports/direct-node-24.json"

      - name: Validate staged candidate on current Node
        if: matrix.node-version == 22
        run: >-
          pnpm dlx node@26.4.0
          packages/aperture/node_modules/tsx/dist/cli.mjs
          packages/aperture/scripts/smoke-attention-worker.ts
          --worker "$RUNNER_TEMP/aperture-attention-worker/lib/aperture-attention-engine.cjs"
          --report "$RUNNER_TEMP/reports/node-current.json"

      - name: Validate direct transport on current Node
        if: matrix.node-version == 22
        run: >-
          pnpm dlx node@26.4.0
          packages/aperture/node_modules/tsx/dist/cli.mjs
          packages/aperture/scripts/smoke-omp-direct-worker.ts
          --worker "$RUNNER_TEMP/aperture-attention-worker/lib/aperture-attention-engine.cjs"
          --report "$RUNNER_TEMP/reports/direct-node-current.json"

      - name: Validate staged OMP extension
        if: matrix.node-version == 22
        run: >-
          pnpm --dir packages/aperture smoke:omp-extension --
          --extension "$RUNNER_TEMP/aperture-attention-worker/integrations/omp/aperture-omp-extension.mjs"
          --manifest "$RUNNER_TEMP/aperture-attention-worker/integrations/omp/package.json"
          --report "$RUNNER_TEMP/reports/omp-adapter.json"
      - name: Record positive three-backend focus smoke
        if: matrix.node-version == 22
        run: >-
          pnpm --dir packages/aperture smoke:focus-backends --
          --report "$RUNNER_TEMP/reports/focus-backends.json"

      - name: Setup Bun for OMP host matrix
        if: matrix.node-version == 22
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Validate actual OMP host matrix
        if: matrix.node-version == 22
        run: >-
          pnpm --dir packages/aperture smoke:omp-host-direct --
          --worker "$RUNNER_TEMP/aperture-attention-worker/lib/aperture-attention-engine.cjs"
          --extension "$RUNNER_TEMP/aperture-attention-worker/integrations/omp/aperture-omp-extension.mjs"
          --omp-version 18.0.11
          --omp-version 18.1.2
          --report "$RUNNER_TEMP/reports/omp-host-matrix.json"
