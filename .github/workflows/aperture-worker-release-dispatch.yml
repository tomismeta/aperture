name: Aperture Worker Release Dispatch

on:
  workflow_run:
    workflows:
      - Aperture Worker Artifact
      - Aperture Worker Direct Release
    types:
      - completed

permissions:
  actions: write
  contents: read

concurrency:
  group: >-
    aperture-worker-release-dispatch-${{ github.event.workflow_run.name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  dispatch-direct-release:
    if: >-
      github.event.workflow_run.name == 'Aperture Worker Artifact' &&
      github.event.workflow_run.path == '.github/workflows/aperture-worker-artifact.yml' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'aperture-worker-v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch packet preparation exactly once
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ github.event.workflow_run.head_branch }}
          SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
          ARTIFACT_RUN_ID: ${{ github.event.workflow_run.id }}
          ARTIFACT_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          [[ "$SOURCE_TAG" =~ ^aperture-worker-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ARTIFACT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          existing=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/aperture-worker-direct-release.yml/runs?event=workflow_dispatch&per_page=100")
          if jq -e --arg tag "$SOURCE_TAG" --arg commit "$SOURCE_COMMIT" '
            any(
              .workflow_runs[];
              .head_branch == $tag and
              .head_sha == $commit and
              (.status != "completed" or .conclusion == "success")
            )
          ' <<<"$existing" >/dev/null; then
            echo "Direct Release already active or successful for $SOURCE_TAG at $SOURCE_COMMIT"
            exit 0
          fi
          gh workflow run aperture-worker-direct-release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$SOURCE_TAG" \
            -f artifact_run_id="$ARTIFACT_RUN_ID" \
            -f artifact_run_attempt="$ARTIFACT_RUN_ATTEMPT"

  dispatch-release-evidence:
    if: >-
      github.event.workflow_run.name == 'Aperture Worker Direct Release' &&
      github.event.workflow_run.path == '.github/workflows/aperture-worker-direct-release.yml' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'aperture-worker-v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch approved evidence publication exactly once
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ github.event.workflow_run.head_branch }}
          SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
          DIRECT_RELEASE_RUN_ID: ${{ github.event.workflow_run.id }}
          DIRECT_RELEASE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          [[ "$SOURCE_TAG" =~ ^aperture-worker-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DIRECT_RELEASE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$DIRECT_RELEASE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          existing=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/aperture-worker-release-evidence.yml/runs?event=workflow_dispatch&per_page=100")
          if jq -e --arg tag "$SOURCE_TAG" --arg commit "$SOURCE_COMMIT" '
            any(
              .workflow_runs[];
              .head_branch == $tag and
              .head_sha == $commit and
              (.status != "completed" or .conclusion == "success")
            )
          ' <<<"$existing" >/dev/null; then
            echo "Release Evidence already active or successful for $SOURCE_TAG at $SOURCE_COMMIT"
            exit 0
          fi
          gh workflow run aperture-worker-release-evidence.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$SOURCE_TAG" \
            -f direct_release_run_id="$DIRECT_RELEASE_RUN_ID" \
            -f direct_release_run_attempt="$DIRECT_RELEASE_RUN_ATTEMPT"
