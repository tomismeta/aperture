name: Aperture Worker Release Evidence

on:
  workflow_dispatch:
    inputs:
      direct_release_run_id:
        description: Successful signed-tag Direct Release run
        required: true
        type: string
      direct_release_run_attempt:
        description: Exact attempt of the successful Direct Release run
        required: true
        type: string

concurrency:
  group: aperture-worker-release-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  finalize:
    if: startsWith(github.ref, 'refs/tags/aperture-worker-v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    env:
      SOURCE_TAG: ${{ github.ref_name }}
      SOURCE_COMMIT: ${{ github.sha }}
      DIRECT_RELEASE_RUN_ID: ${{ inputs.direct_release_run_id }}
      DIRECT_RELEASE_RUN_ATTEMPT: ${{ inputs.direct_release_run_attempt }}

    steps:
      - name: Checkout exact release source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize evidence paths
        run: |
          printf 'PACKET_DIR=%s/direct-release-packet\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'PAYLOAD_DIR=%s/aperture-worker\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Verify protected-main source and completed direct run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$SOURCE_TAG" =~ ^aperture-worker-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$DIRECT_RELEASE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$DIRECT_RELEASE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          test "$GITHUB_REF" = "refs/tags/$SOURCE_TAG"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git status --porcelain)"

          protected_main=$(gh api "repos/$GITHUB_REPOSITORY/branches/main")
          test "$(jq -r '.protected' <<<"$protected_main")" = "true"
          jq -e '.protection.required_status_checks.contexts | index("release-check") != null' \
            <<<"$protected_main"
          main_ref="refs/remotes/origin/release-main"
          git fetch --no-tags --force origin "refs/heads/main:$main_ref"
          git merge-base --is-ancestor "$SOURCE_COMMIT" "$main_ref"
          git show "$main_ref:.github/release-signers" > "$RUNNER_TEMP/release-signers"
          test -s "$RUNNER_TEMP/release-signers"

          tag_object=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$SOURCE_TAG" --jq '.object.sha')
          tag_type=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$SOURCE_TAG" --jq '.object.type')
          test "$tag_type" = "tag"
          verification_ref="refs/tags/release-verification/$SOURCE_TAG"
          git fetch --no-tags --force origin \
            "refs/tags/$SOURCE_TAG:$verification_ref"
          test "$(git rev-parse "$verification_ref")" = "$tag_object"
          test "$(git cat-file -t "$verification_ref")" = "tag"
          test "$(git rev-parse "$verification_ref^{}")" = "$SOURCE_COMMIT"
          git -c gpg.format=ssh \
            -c gpg.ssh.allowedSignersFile="$RUNNER_TEMP/release-signers" \
            verify-tag "$verification_ref"
          tag_commit=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" --jq '.object.sha')
          tag_verified=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" --jq '.verification.verified')
          test "$tag_commit" = "$SOURCE_COMMIT"
          test "$tag_verified" = "true"

          direct_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DIRECT_RELEASE_RUN_ID")
          test "$(jq -r '.name' <<<"$direct_run")" = "Aperture Worker Direct Release"
          test "$(jq -r '.path' <<<"$direct_run")" = ".github/workflows/aperture-worker-direct-release.yml"
          test "$(jq -r '.event' <<<"$direct_run")" = "workflow_dispatch"
          test "$(jq -r '.conclusion' <<<"$direct_run")" = "success"
          test "$(jq -r '.head_branch' <<<"$direct_run")" = "$SOURCE_TAG"
          test "$(jq -r '.head_sha' <<<"$direct_run")" = "$SOURCE_COMMIT"
          test "$(jq -r '.run_attempt' <<<"$direct_run")" = "$DIRECT_RELEASE_RUN_ATTEMPT"
          test "$(jq -r '.head_repository.full_name' <<<"$direct_run")" = "$GITHUB_REPOSITORY"
          if existing_release=$(gh release view "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isImmutable 2>/dev/null); then
            test "$(jq -r '.isDraft' <<<"$existing_release")" = "true" || {
              echo "published release already exists for $SOURCE_TAG" >&2
              exit 1
            }
            test "$(jq -r '.isImmutable' <<<"$existing_release")" = "false"
          fi

      - name: Download exact direct release packet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$PACKET_DIR" "$PAYLOAD_DIR"
          gh run download "$DIRECT_RELEASE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$SOURCE_TAG-direct-release-packet" \
            --dir "$PACKET_DIR"

      - name: Verify packet metadata and completed prerequisite runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          metadata="$PACKET_DIR/direct-release-metadata.json"
          jq -e \
            --arg tag "$SOURCE_TAG" \
            --arg commit "$SOURCE_COMMIT" \
            --arg directRun "$DIRECT_RELEASE_RUN_ID" \
            --arg directAttempt "$DIRECT_RELEASE_RUN_ATTEMPT" '
              .schemaVersion == 2 and
              .sourceTag == $tag and
              .sourceCommit == $commit and
              .protectedMainRef == "refs/heads/main" and
              .workflowRuns.directRelease.id == $directRun and
              .workflowRuns.directRelease.attempt == $directAttempt and
              ([.workflowRuns.releaseCheck.id,
                .workflowRuns.releaseCheck.attempt,
                .workflowRuns.workerArtifact.id,
                .workflowRuns.workerArtifact.attempt] |
                all(type == "string" and test("^[1-9][0-9]*$"))) and
              .releasePolicy.environment == "aperture-worker-release" and
              .releasePolicy.immutableReleasesRequired == true and
              (.archive.name == ($tag + ".tar.gz")) and
              (.archive.bytes | type == "number" and . > 0) and
              (.archive.sha256 | test("^[0-9a-f]{64}$")) and
              (.buildInfo.bytes | type == "number" and . > 0) and
              (.buildInfo.sha256 | test("^[0-9a-f]{64}$")) and
              ([.attestations.payload, .attestations.buildInfo, .attestations.archive] |
                all(test("^https://github.com/[^/]+/[^/]+/attestations/[0-9]+$")))
            ' "$metadata"
          release_check_run_id=$(jq -r '.workflowRuns.releaseCheck.id' "$metadata")
          release_check_run_attempt=$(jq -r '.workflowRuns.releaseCheck.attempt' "$metadata")
          artifact_run_id=$(jq -r '.workflowRuns.workerArtifact.id' "$metadata")
          artifact_run_attempt=$(jq -r '.workflowRuns.workerArtifact.attempt' "$metadata")
          release_check=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$release_check_run_id")
          test "$(jq -r '.name' <<<"$release_check")" = "Release Check"
          test "$(jq -r '.path' <<<"$release_check")" = ".github/workflows/release-check.yml"
          test "$(jq -r '.event' <<<"$release_check")" = "push"
          test "$(jq -r '.conclusion' <<<"$release_check")" = "success"
          test "$(jq -r '.head_branch' <<<"$release_check")" = "main"
          test "$(jq -r '.head_sha' <<<"$release_check")" = "$SOURCE_COMMIT"
          test "$(jq -r '.run_attempt' <<<"$release_check")" = "$release_check_run_attempt"
          test "$(jq -r '.head_repository.full_name' <<<"$release_check")" = "$GITHUB_REPOSITORY"
          artifact_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$artifact_run_id")
          test "$(jq -r '.name' <<<"$artifact_run")" = "Aperture Worker Artifact"
          test "$(jq -r '.path' <<<"$artifact_run")" = ".github/workflows/aperture-worker-artifact.yml"
          test "$(jq -r '.event' <<<"$artifact_run")" = "push"
          test "$(jq -r '.conclusion' <<<"$artifact_run")" = "success"
          test "$(jq -r '.head_branch' <<<"$artifact_run")" = "$SOURCE_TAG"
          test "$(jq -r '.head_sha' <<<"$artifact_run")" = "$SOURCE_COMMIT"
          test "$(jq -r '.run_attempt' <<<"$artifact_run")" = "$artifact_run_attempt"
          test "$(jq -r '.head_repository.full_name' <<<"$artifact_run")" = "$GITHUB_REPOSITORY"
          archive="$PACKET_DIR/$SOURCE_TAG.tar.gz"
          test "$(wc -c < "$archive" | tr -d '[:space:]')" = "$(jq -r '.archive.bytes' "$metadata")"
          test "$(sha256sum "$archive" | cut -d' ' -f1)" = "$(jq -r '.archive.sha256' "$metadata")"
          (cd "$PACKET_DIR" && sha256sum -c "$SOURCE_TAG.tar.gz.sha256")

      - name: Extract archive without trusting member paths
        env:
          ARCHIVE_PATH: ${{ runner.temp }}/direct-release-packet/${{ github.ref_name }}.tar.gz
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import tarfile

          archive = pathlib.Path(os.environ["ARCHIVE_PATH"])
          destination = pathlib.Path(os.environ["PAYLOAD_DIR"])
          allowed_roots = {"BUILDINFO.json", "config", "evidence", "fixtures", "integrations", "lib", "schemas"}
          seen = set()
          with tarfile.open(archive, "r:gz") as stream:
              members = stream.getmembers()
              for member in members:
                  path = pathlib.PurePosixPath(member.name)
                  if path.is_absolute() or not path.parts or any(part in {"", ".", ".."} for part in path.parts):
                      raise SystemExit(f"unsafe archive member: {member.name!r}")
                  if path.parts[0] not in allowed_roots:
                      raise SystemExit(f"unexpected archive root: {member.name!r}")
                  if member.name in seen:
                      raise SystemExit(f"duplicate archive member: {member.name!r}")
                  if not (member.isdir() or member.isfile()):
                      raise SystemExit(f"unsupported archive member type: {member.name!r}")
                  seen.add(member.name)
              stream.extractall(destination, members, filter="data")
          PY

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.29.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.13.0
          cache: pnpm

      - name: Install exact source dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify complete archive and all tag-bound attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          metadata="$PACKET_DIR/direct-release-metadata.json"
          archive="$PACKET_DIR/$SOURCE_TAG.tar.gz"
          test "$(wc -c < "$PAYLOAD_DIR/BUILDINFO.json" | tr -d '[:space:]')" = "$(jq -r '.buildInfo.bytes' "$metadata")"
          test "$(sha256sum "$PAYLOAD_DIR/BUILDINFO.json" | cut -d' ' -f1)" = "$(jq -r '.buildInfo.sha256' "$metadata")"
          test "$(cut -d' ' -f1 "$PACKET_DIR/BUILDINFO.sha256")" = "$(jq -r '.buildInfo.sha256' "$metadata")"
          gh attestation verify "$archive" \
            --repo "$GITHUB_REPOSITORY" \
            --source-ref "refs/tags/$SOURCE_TAG" \
            --source-digest "$SOURCE_COMMIT" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/aperture-worker-direct-release.yml"
          gh attestation verify "$PAYLOAD_DIR/BUILDINFO.json" \
            --repo "$GITHUB_REPOSITORY" \
            --source-ref "refs/tags/$SOURCE_TAG" \
            --source-digest "$SOURCE_COMMIT" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/aperture-worker-direct-release.yml"
          while IFS= read -r relative; do
            gh attestation verify "$PAYLOAD_DIR/$relative" \
              --repo "$GITHUB_REPOSITORY" \
              --source-ref "refs/tags/$SOURCE_TAG" \
              --source-digest "$SOURCE_COMMIT" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/aperture-worker-direct-release.yml"
          done < <(jq -r '.files[].path' "$PAYLOAD_DIR/BUILDINFO.json")
          pnpm exec tsx packages/aperture/scripts/finalize-direct-release-packet.ts -- \
            --artifact-dir "$PAYLOAD_DIR" \
            --source-commit "$SOURCE_COMMIT" \
            --source-tag "$SOURCE_TAG" \
            --verify-only

      - name: Write truthful completed-workflow release report
        run: |
          metadata="$PACKET_DIR/direct-release-metadata.json"
          pnpm exec tsx packages/aperture/scripts/write-combined-release-report.ts -- \
            --artifact-dir "$PAYLOAD_DIR" \
            --archive "$PACKET_DIR/$SOURCE_TAG.tar.gz" \
            --archive-attestation-reference "$(jq -r '.attestations.archive' "$metadata")" \
            --buildinfo-attestation-reference "$(jq -r '.attestations.buildInfo' "$metadata")" \
            --release-check-run-id "$(jq -r '.workflowRuns.releaseCheck.id' "$metadata")" \
            --release-check-run-attempt "$(jq -r '.workflowRuns.releaseCheck.attempt' "$metadata")" \
            --worker-artifact-run-id "$(jq -r '.workflowRuns.workerArtifact.id' "$metadata")" \
            --worker-artifact-run-attempt "$(jq -r '.workflowRuns.workerArtifact.attempt' "$metadata")" \
            --direct-release-run-id "$DIRECT_RELEASE_RUN_ID" \
            --direct-release-run-attempt "$DIRECT_RELEASE_RUN_ATTEMPT" \
            --evidence-finalizer-run-id "$GITHUB_RUN_ID" \
            --evidence-finalizer-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --artifact-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$SOURCE_TAG/$SOURCE_TAG.tar.gz" \
            --output "$PACKET_DIR/release-report.json"
          jq -e \
            --arg tag "$SOURCE_TAG" \
            --arg commit "$SOURCE_COMMIT" \
            --arg directRun "$DIRECT_RELEASE_RUN_ID" \
            --arg directAttempt "$DIRECT_RELEASE_RUN_ATTEMPT" \
            --arg evidenceRun "$GITHUB_RUN_ID" \
            --arg evidenceAttempt "$GITHUB_RUN_ATTEMPT" '
              .schemaVersion == 3 and
              .status == "passed" and
              .signedTag == $tag and
              .signedTagCommit == $commit and
              .sourceTrust.protectedMainRef == "refs/heads/main" and
              .sourceTrust.requiredStatusCheck == "release-check" and
              .sourceTrust.signerAllowlistSource == "protected-main" and
              .workflowChain.directRelease.runId == $directRun and
              .workflowChain.directRelease.runAttempt == $directAttempt and
              .workflowChain.directRelease.conclusion == "success" and
              .finalization.runId == $evidenceRun and
              .finalization.runAttempt == $evidenceAttempt and
              .finalization.workflowName == "Aperture Worker Release Evidence" and
              .finalization.event == "workflow_dispatch" and
              (.finalization | has("conclusion") | not) and
              .releasePolicy.environment == "aperture-worker-release" and
              .releasePolicy.immutableReleasesRequired == true and
              .attestationPolicy.releaseReportSignerWorkflow ==
                "tomismeta/aperture/.github/workflows/aperture-worker-release-evidence.yml" and
              .artifactMode == "omp-only" and
              .notificationInput == false and
              .legacyNotificationState == "removed-without-restore" and
              .ompOnlyWorkerProof == "aperture-omp-only-worker-conformance-v1" and
              .ompOnlyWorkerEvidence == "evidence/omp-only-worker.json" and
              (has("ambientCeilingProof") | not) and
              .ompPackageVersion == "0.1.0" and
              .aperturePackageVersion == "0.10.0" and
              .apertureCoreVersion == "0.9.0" and
              .artifactLimits.maximumTextArtifactBytes == 524288 and
              .schemaVersions.notificationInput == false and
              .schemaVersions.notificationOutputSchemaVersion == 4 and
              .schemaVersions.surfaceProtocolVersion == 4 and
              .schemaVersions.workerDirectProtocolVersion == 4 and
              .allValidationsPassed == true and
              .schemaVersions.jsonlHandshakes.privateWorker.protocolVersion == 4 and
              .schemaVersions.jsonlHandshakes.privateWorker.outputEncoding == "ascii-json-escapes" and
              .schemaVersions.jsonlHandshakes.privateWorker.navigation == "validated-opaque-focus-only" and
              .schemaVersions.jsonlHandshakes.publicSurface.protocolVersion == 4 and
              .schemaVersions.jsonlHandshakes.publicSurface.outputEncoding == "ascii-json-escapes" and
              .schemaVersions.jsonlHandshakes.publicSurface.navigation == "absent" and
              .directSocketLifecycle.lifecycleSerialization == "hard-link-owner-lock" and
              .directSocketLifecycle.cleanupDeadlineMs == 1500 and
              .unmetPrerequisites == []
            ' "$PACKET_DIR/release-report.json"

      - name: Attest completed release report
        id: report-provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: ${{ runner.temp }}/direct-release-packet/release-report.json

      - name: Verify report attestation and write release sidecar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify "$PACKET_DIR/release-report.json" \
            --repo "$GITHUB_REPOSITORY" \
            --source-ref "refs/tags/$SOURCE_TAG" \
            --source-digest "$SOURCE_COMMIT" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/aperture-worker-release-evidence.yml"
          report_sha=$(sha256sum "$PACKET_DIR/release-report.json" | cut -d' ' -f1)
          report_bytes=$(wc -c < "$PACKET_DIR/release-report.json" | tr -d '[:space:]')
          jq -n \
            --arg sourceTag "$SOURCE_TAG" \
            --arg sourceCommit "$SOURCE_COMMIT" \
            --arg evidenceFinalizerRunId "$GITHUB_RUN_ID" \
            --arg evidenceFinalizerRunAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg reportSha256 "$report_sha" \
            --arg reportAttestationReference "${{ steps.report-provenance.outputs.attestation-url }}" \
            --argjson reportBytes "$report_bytes" \
            '{
              schemaVersion: 2,
              sourceTag: $sourceTag,
              sourceCommit: $sourceCommit,
              evidenceFinalizer: {
                id: $evidenceFinalizerRunId,
                attempt: $evidenceFinalizerRunAttempt
              },
              releasePolicy: {
                environment: "aperture-worker-release",
                immutableReleasesRequired: true
              },
              releaseReport: {
                path: "release-report.json",
                bytes: $reportBytes,
                sha256: $reportSha256,
                attestationReference: $reportAttestationReference
              }
            }' > "$PACKET_DIR/release-metadata.json"

      - name: Upload finalized release packet
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.SOURCE_TAG }}-final-release
          path: |
            ${{ runner.temp }}/direct-release-packet/${{ env.SOURCE_TAG }}.tar.gz
            ${{ runner.temp }}/direct-release-packet/${{ env.SOURCE_TAG }}.tar.gz.sha256
            ${{ runner.temp }}/direct-release-packet/BUILDINFO.sha256
            ${{ runner.temp }}/direct-release-packet/release-report.json
            ${{ runner.temp }}/direct-release-packet/release-metadata.json
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: finalize
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: aperture-worker-release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    permissions:
      actions: read
      contents: write
    env:
      SOURCE_TAG: ${{ github.ref_name }}
      SOURCE_COMMIT: ${{ github.sha }}

    steps:
      - name: Initialize publisher path
        run: printf 'RELEASE_DIR=%s/final-release\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Download exact finalized packet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RELEASE_DIR"
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$SOURCE_TAG-final-release" \
            --dir "$RELEASE_DIR"

      - name: Validate publisher inputs and create private draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          metadata="$RELEASE_DIR/release-metadata.json"
          report="$RELEASE_DIR/release-report.json"
          jq -e \
            --arg tag "$SOURCE_TAG" \
            --arg commit "$SOURCE_COMMIT" \
            --arg run "$GITHUB_RUN_ID" \
            --arg attempt "$GITHUB_RUN_ATTEMPT" '
              .schemaVersion == 2 and
              .sourceTag == $tag and
              .sourceCommit == $commit and
              .evidenceFinalizer.id == $run and
              .evidenceFinalizer.attempt == $attempt and
              .releasePolicy.environment == "aperture-worker-release" and
              .releasePolicy.immutableReleasesRequired == true and
              .releaseReport.path == "release-report.json" and
              (.releaseReport.bytes | type == "number" and . > 0) and
              (.releaseReport.sha256 | test("^[0-9a-f]{64}$")) and
              (.releaseReport.attestationReference |
                test("^https://github.com/[^/]+/[^/]+/attestations/[0-9]+$"))
            ' "$metadata"
          test "$(wc -c < "$report" | tr -d '[:space:]')" = "$(jq -r '.releaseReport.bytes' "$metadata")"
          test "$(sha256sum "$report" | cut -d' ' -f1)" = "$(jq -r '.releaseReport.sha256' "$metadata")"
          jq -e \
            --arg tag "$SOURCE_TAG" \
            --arg commit "$SOURCE_COMMIT" \
            --arg run "$GITHUB_RUN_ID" \
            --arg attempt "$GITHUB_RUN_ATTEMPT" '
              .schemaVersion == 3 and
              .status == "passed" and
              .signedTag == $tag and
              .signedTagCommit == $commit and
              .finalization.runId == $run and
              .finalization.runAttempt == $attempt and
              .finalization.event == "workflow_dispatch" and
              .releasePolicy.environment == "aperture-worker-release" and
              .releasePolicy.immutableReleasesRequired == true and
              .artifactMode == "omp-only" and
              .notificationInput == false and
              (.finalization | has("conclusion") | not)
            ' "$report"
          (cd "$RELEASE_DIR" && sha256sum -c "$SOURCE_TAG.tar.gz.sha256")
          if existing_release=$(gh release view "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isImmutable 2>/dev/null); then
            test "$(jq -r '.isDraft' <<<"$existing_release")" = "true" || {
              echo "published release already exists for $SOURCE_TAG" >&2
              exit 1
            }
            test "$(jq -r '.isImmutable' <<<"$existing_release")" = "false"
            gh release delete "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi
          gh release create "$SOURCE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "Aperture Worker" \
            --notes "Signed production OMP-only worker payload for Aperture. Verify the protected-main source, completed workflow run IDs and attempts, attestations, release report, and every archive member before vendoring." \
            "$RELEASE_DIR/$SOURCE_TAG.tar.gz" \
            "$RELEASE_DIR/$SOURCE_TAG.tar.gz.sha256" \
            "$RELEASE_DIR/BUILDINFO.sha256" \
            "$report" \
            "$metadata"

      - name: Verify complete draft and publish atomically
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release=$(gh release view "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isImmutable,isPrerelease,tagName,targetCommitish,assets)
          jq -e \
            --arg tag "$SOURCE_TAG" '
              .isDraft == true and
              .isImmutable == false and
              .isPrerelease == false and
              .tagName == $tag and
              ([.assets[].name] | sort) ==
                (["BUILDINFO.sha256", "release-metadata.json", "release-report.json", ($tag + ".tar.gz"), ($tag + ".tar.gz.sha256")] | sort)
            ' <<<"$release"
          gh release edit "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          published=$(gh release view "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isImmutable,isPrerelease,tagName,assets)
          if ! jq -e \
            --arg tag "$SOURCE_TAG" '
              .isDraft == false and
              .isImmutable == true and
              .isPrerelease == false and
              .tagName == $tag and
              ([.assets[].name] | sort) ==
                (["BUILDINFO.sha256", "release-metadata.json", "release-report.json", ($tag + ".tar.gz"), ($tag + ".tar.gz.sha256")] | sort)
            ' <<<"$published"; then
            if jq -e '.isDraft == false and .isImmutable == false' <<<"$published" >/dev/null; then
              gh release delete "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --yes
            fi
            echo "published release did not satisfy the immutable release contract" >&2
            exit 1
          fi
